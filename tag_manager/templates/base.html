<body>

    </aside>
    <div id="nav-loading" class="nav-loading">加载中...</div>
    <main class="app-main"{% block main_attrs %}{% endblock %}>
      {% block content %}{% endblock %}
    </main>
  </div>
  <script>
  (function() {
    const nav = document.querySelector('[data-main-nav]');
    const main = document.querySelector('main');
    const overlay = document.getElementById('nav-loading');

    function updateActiveNav(path) {
      nav.querySelectorAll('a').forEach(a => {
        a.classList.toggle('active', path.startsWith(a.getAttribute('href')));
      });
    }

    function execScripts(container) {
      container.querySelectorAll('script').forEach(old => {
        const s = document.createElement('script');
        if (old.src) { s.src = old.src; } else { s.textContent = old.textContent; }
        old.replaceWith(s);
      });
    }

    function saveTextareas() {
      main.querySelectorAll('textarea[id], input[id], select[id]').forEach(el => {
        if (el.type === 'hidden' || el.type === 'checkbox') return;
        sessionStorage.setItem('_persist_' + el.id, el.value);
      });
    }

    function restoreTextareas() {
      main.querySelectorAll('textarea[id], input[id], select[id]').forEach(el => {
        if (el.type === 'hidden' || el.type === 'checkbox') return;
        const saved = sessionStorage.getItem('_persist_' + el.id);
        if (saved != null) el.value = saved;
      });
    }

    function isHeavyPage() {
      // 声明式 heavy 检测：大页面模板在 <main> 上声明 data-heavy，导航前不做全树扫描
      return main.hasAttribute('data-heavy');
    }

    function showOverlay() {
      overlay.classList.add('active');
      requestAnimationFrame(() => requestAnimationFrame(() => {
        overlay.style.opacity = '1';
        overlay.style.pointerEvents = 'auto';
      }));
    }

    function hideOverlay() {
      overlay.style.opacity = '0';
      overlay.style.pointerEvents = 'none';
      overlay.addEventListener('transitionend', function handler() {
        overlay.removeEventListener('transitionend', handler);
        overlay.classList.remove('active');
      });
    }

    // 导航序号 + AbortController：新导航发起时取消旧 fetch，旧响应晚到时直接丢弃，
    // 不再触发全量替换；返回 'superseded' 表示已被更新的导航取代（不算失败，不整页回退）。
    var navSeq = 0;
    var navAbort = null;
    var navBusy = false;
    var navBusyUrl = null;

    async function navigate(url, pushState) {
      const seq = ++navSeq;
      if (navAbort) navAbort.abort();
      const controller = new AbortController();
      navAbort = controller;
      navBusy = true;
      navBusyUrl = url;
      showOverlay();
      await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
      if (seq !== navSeq) return 'superseded';

      if (typeof window.__wardrobePageCleanup === 'function') window.__wardrobePageCleanup();
      saveTextareas();
      if (isHeavyPage()) main.textContent = '';

      try {
        const resp = await fetch(url, {signal: controller.signal});
        if (seq !== navSeq) return 'superseded';
        if (!resp.ok) { hideOverlay(); return false; }
        const html = await resp.text();
        if (seq !== navSeq) return 'superseded';
        const doc = new DOMParser().parseFromString(html, 'text/html');
        const newMain = doc.querySelector('main');
        if (!newMain) { hideOverlay(); return false; }
        main.innerHTML = newMain.innerHTML;
        // main 元素本身不换，需同步新页面的 heavy 声明供下次导航判断
        if (newMain.hasAttribute('data-heavy')) main.setAttribute('data-heavy', '');
        else main.removeAttribute('data-heavy');
        execScripts(main);
        restoreTextareas();
        hideOverlay();
        if (pushState) history.pushState(null, '', url);
        updateActiveNav(new URL(url, location.origin).pathname);
        window.scrollTo(0, 0);
        return true;
      } catch(e) {
        if (e && e.name === 'AbortError') return 'superseded';
        hideOverlay();
        return false;
      } finally {
        if (seq === navSeq) { navBusy = false; navBusyUrl = null; }
      }
    }

    nav.addEventListener('click', e => {
      const a = e.target.closest('a');
      if (!a || !a.getAttribute('href').startsWith('/')) return;
      if (a.hasAttribute('data-full-load')) return;
      e.preventDefault();
      // 导航进行中忽略同链接重复点击，避免并发全量替换
      if (navBusy && navBusyUrl === a.href) return;
      navigate(a.href, true).then(ok => { if (ok === false) location.href = a.href; });
    });

    document.querySelector('.brand').addEventListener('click', e => {
      e.preventDefault();
      if (navBusy && navBusyUrl === location.origin + '/') return;
      navigate('/', true).then(ok => { if (ok === false) location.href = '/'; });
    });

    window.addEventListener('popstate', () => { navigate(location.href, false); });

    updateActiveNav(location.pathname);
  })();
  </script>

  <div id="sys-update-toast" class="update-toast">
    <div class="update-toast-header">
      <span id="sys-update-title">发现新版本</span>
      <span class="update-toast-close" onclick="document.getElementById('sys-update-toast').classList.remove('show')">×</span>
    </div>
    <div class="update-toast-body">
      <a href="/update" id="sys-update-link">前往更新页</a>
    </div>
    <div class="update-toast-progress"></div>
  </div>

  <script>
    (function checkUpdateOnStartup() {
      if (sessionStorage.getItem('update_checked_once')) return;
      sessionStorage.setItem('update_checked_once', '1');

      fetch('/api/update/check')
        .then(res => res.json())
        .then(data => {
          if (data && data.status === 'behind' && data.remote_version) {
            document.getElementById('sys-update-title').textContent = '发现新版本 v' + data.remote_version;
            const toast = document.getElementById('sys-update-toast');
            toast.style.display = 'block';
            requestAnimationFrame(() => requestAnimationFrame(() => {
              toast.classList.add('show');
            }));
            setTimeout(() => {
              toast.classList.remove('show');
              toast.addEventListener('transitionend', function handler() {
                toast.removeEventListener('transitionend', handler);
                toast.style.display = 'none';
              });
            }, 5000);
          }
        })
        .catch(() => {}); // silent catch
    })();
  </script>
</body>
</html>
